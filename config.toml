# =============================================================================
# config.toml — AI Director Video Commentary (Enhanced Version)
# All configuration from this file. No .env needed.
# =============================================================================

[api]
# ---- Backend viết kịch bản (hooks + narration) ----
# "local" (MẶC ĐỊNH): chạy model nhẹ ngay trên máy/Colab, không cần API key,
#   không có rủi ro "context_length_exceeded" hay "model reasoning nuốt hết
#   token" mà backend cerebras từng gặp với phim nhiều scene. Xem
#   [processing] script_local_* bên dưới để đổi model/device.
# "cerebras": dùng lại API Cerebras như bản gốc — đổi về giá trị này nếu bạn
#   muốn quay lại (vẫn được hỗ trợ đầy đủ, đã vá lỗi reasoning bên dưới).
script_backend = "local"

# Cerebras API for script writing (chỉ dùng khi script_backend = "cerebras")
cerebras_api_key = "csk-vdmwee9e6kpmpyxdcfkvrxrcyhekh5w6vk39nwfc9wxmpkhk"
cerebras_base_url = "https://api.cerebras.ai/v1"
cerebras_model = "zai-glm-4.7"
cerebras_max_tokens = 8000
cerebras_temperature = 0.8

# Gemini API key (chỉ dùng khi tts.engine = "gemini") — lấy miễn phí tại
# https://aistudio.google.com/apikey
gemini_api_key = "AQ.Ab8RN6JcC9xYG7FMEFWNDqU20SnifWq4cM_kEQTIiq455jm3fw"
# zai-glm-4.7 là model REASONING (tự "suy nghĩ nội bộ" trước khi trả lời).
# Với các lệnh gọi ở đây ta chỉ cần JSON có cấu trúc, không cần suy luận
# thành tiếng — tắt nó đi để tránh lỗi "response rỗng vì hết ngân sách token
# cho suy luận" (xem BUGFIX trong script_writer.py). Đổi false nếu muốn giữ
# reasoning (không khuyến khích, tốn token + dễ lỗi hơn cho tác vụ JSON).
cerebras_disable_reasoning = true
# Context window THẬT của model Cerebras đang dùng (input+output cộng lại).
# Dùng để chia semantic blocks thành nhiều batch nhỏ khi sinh narration cho
# phim dài (xem BUGFIX trong script_writer.py: trước đây dồn hết 1600+ scene
# vào 1 request -> lỗi context_length_exceeded). Đổi nếu bạn dùng model có
# context lớn hơn/nhỏ hơn 8192 token.
cerebras_max_context_tokens = 8192
# Số token output tối đa CHO MỖI BATCH narration (khác với cerebras_max_tokens
# ở trên, vốn dùng cho các lệnh gọi 1-shot khác như generate_hooks). Để nhỏ
# vì mỗi batch chỉ cần vài chục câu, dành phần lớn ngân sách token cho input
# (scene blocks).
cerebras_narration_batch_max_tokens = 2000

# Hugging Face token (for Qwen3-VL-4B-Instruct or other models)
hf_token = ""

# Mistral API for vision analysis
mistral_api_key = "WJkOtf6FxncjGsfLs2mujxew0ikNIDKX"
mistral_base_url = "https://api.mistral.ai/v1"

[tts]
# "piper" (MẶC ĐỊNH): model TTS LOCAL cực nhẹ (ONNX, vài chục MB), chạy nhanh
# ngay cả trên CPU yếu, KHÔNG cần GPU, KHÔNG cần venv riêng, KHÔNG phụ thuộc
# mạng lúc chạy (chỉ tải giọng ~vài chục MB một lần đầu) -> đơn giản và ổn
# định nhất, không bị lỗi mạng như edge-tts, không bị vướng xung đột phiên
# bản Python/package nặng nề như engine local cũ (viterbox, đã gỡ bỏ khỏi dự
# án vì package ghim numba/librosa không tương thích Python 3.12 trên CI).
# Giọng không tự nhiên/biểu cảm bằng Gemini, nhưng vẫn rõ ràng, dễ nghe hiểu.
# "edge-tts": API không chính thức của Microsoft, hay bị chặn/rớt kết nối
# (NoAudioReceived) khi chạy từ IP datacenter như GitHub Actions.
# "gemini": gọi Gemini TTS API của Google (cần điền api.gemini_api_key bên
# dưới) -> giọng rất tự nhiên, không cần GPU, chi phí rất rẻ (~0.01-0.05 USD/
# video), nhưng cần internet + API key và model đang ở bản Preview.
engine = "piper"

# ---- piper (local, nhẹ, dùng khi engine = "piper") ----
# Định dạng tên giọng: "<mã_ngôn_ngữ>-<tên_giọng>-<chất_lượng>". Giọng tiếng
# Việt tốt nhất hiện có trên Piper là vais1000 (chất lượng "medium") — các
# lựa chọn khác: "vi_VN-25hours_single-low" (nhẹ hơn, chất lượng thấp hơn).
# Danh sách đầy đủ mọi ngôn ngữ: https://github.com/rhasspy/piper/blob/master/VOICES.md
# Model (~60MB) tự động tải về lần đầu chạy, lưu vào piper_data_dir bên dưới.
piper_voice = "vi_VN-vais1000-medium"
# Để trống -> tự lưu vào paths.model_cache_dir/piper_voices
# piper_data_dir = "./model_cache/piper_voices"

# ---- gemini (cloud API, dùng khi engine = "gemini") ----
# Cần điền api.gemini_api_key ở mục [api] bên dưới (lấy miễn phí tại
# https://aistudio.google.com/apikey).
# Model TTS hiện có: "gemini-2.5-flash-preview-tts" (rẻ, nhanh — khuyến nghị),
# "gemini-2.5-pro-preview-tts" (chất lượng cao hơn, đắt hơn),
# "gemini-3.1-flash-tts-preview" (mới nhất, hỗ trợ audio tags [whispers] v.v.)
gemini_model = "gemini-2.5-flash-preview-tts"
# 30 giọng có sẵn, xem đầy đủ tại https://ai.google.dev/gemini-api/docs/speech-generation#voices
# "Kore" (firm), "Puck" (upbeat), "Charon" (informative), "Aoede" (breezy)...
gemini_voice = "Kore"
# Prompt định hướng phong cách đọc (tuỳ chọn) — thêm vào TRƯỚC mỗi câu narration.
# Để trống -> Gemini tự đọc câu văn bình thường, không có chỉ đạo phong cách.
# gemini_style_prompt = "Đọc với giọng người dẫn chuyện phim tài liệu, trầm ấm, rõ ràng, tốc độ vừa phải:"
# Số request song song cùng lúc. Đây là API TRẢ PHÍ có rate-limit thực sự
# (RPM giới hạn, nhất là ở free tier/preview) nên để thấp hơn nhiều so với
# edge-tts — tăng lên nếu tài khoản có quota cao hơn.
gemini_max_concurrency = 5

# ---- edge-tts (dự phòng, dùng khi engine = "edge-tts") ----
# Vietnamese: "vi-VN-HoangMinhNeural", "vi-VN-NamMinhNeural"
# English: "en-US-JennyNeural", "en-US-GuyNeural"
voice = "vi-VN-HoangMinhNeural"
rate = "+0%"
volume = "+0%"
pitch = "+0Hz"
# Số câu tổng hợp song song cùng lúc. edge-tts ổn định, không rate-limit
# cứng như API trả phí -> chạy song song thay vì tuần tự giúp nhanh hơn
# nhiều lần với storyboard có nhiều câu. 40 là mức an toàn thực tế (đủ
# nhanh, ít khi bị timeout/nghẽn do mở quá nhiều kết nối cùng lúc).
max_concurrency = 40

[processing]
# ---- Script writing (hooks + narration), backend "local" ----
# ĐÃ ĐỔI từ Qwen3-4B-Instruct-2507 (transformers, float32-trên-CPU + giả lập
# 8bit bằng bitsandbytes) sang Gemma 4 12B Instruct bản QAT, chạy qua
# llama.cpp (định dạng GGUF) thay vì transformers.
# Lý do đổi: repo cũ dùng Gemma 4 E4B khá nhẹ nhưng chất lượng narration chưa
# đủ tốt cho video recap dài. Bản 12B này mạnh hơn rõ rệt ở suy luận, giữ mạch
# truyện và viết câu tự nhiên hơn, đổi lại file model lớn hơn (~7GB cho Q4_0)
# nên phù hợp hơn với máy có RAM khá; script_writer.py vẫn tự giảm n_ctx khi
# phát hiện RAM trống thấp để tránh OOM.
# Repo Hugging Face public, KHÔNG bị gate, nên KHÔNG cần điền api.hf_token.
script_local_gguf_repo = "lmstudio-community/gemma-4-12B-it-QAT-GGUF"
# Dùng đúng file GGUF được repo này publish cho llama.cpp. Nếu sau này muốn thử
# biến thể khác, chỉ cần đổi 1 dòng này sang tên file .gguf tương ứng.
script_local_gguf_filename = "gemma-4-12B-it-QAT-Q4_0.gguf"
script_local_device = "auto"          # auto | cuda | cpu
# Số layer đẩy lên GPU (chỉ có tác dụng nếu llama-cpp-python được build kèm
# hỗ trợ CUDA/Metal và device thật sự có GPU) — -1 = đẩy toàn bộ layer lên
# GPU nếu có, 0 = chạy thuần CPU. "auto" tự chọn theo device phát hiện được.
script_local_gpu_layers = "auto"      # auto | số nguyên (vd -1, 0, 20)
script_local_temperature = 0.7
script_local_top_p = 0.8
script_local_top_k = 20
# Ngân sách token OUTPUT tối đa cho mỗi lần sinh (hooks hoặc 1 batch
# narration) — không cắt cứng như trước; đây là TRẦN trên, ngân sách thật sự
# vẫn được tính động = n_ctx của model trừ input đã dùng (xem
# LocalScriptModel.chat trong script_writer.py).
script_local_max_new_tokens = 3000
# n_ctx (context window) cấp cho llama.cpp lúc load model — KHÁC với bản
# transformers cũ (context window "vốn có" của model, không cần cấp trước):
# ở llama.cpp, RAM cho KV cache được CẤP PHÁT SẴN ngay khi tải model theo
# đúng con số này, nên để quá cao dễ OOM ngay lúc LOAD thay vì lúc generate.
# Giá trị dưới đây được tự động giảm nếu RAM trống lúc load thấp (xem
# LocalScriptModel.load) — con số ở config chỉ là TRẦN tối đa mong muốn.
script_local_max_context_tokens = 16000

# ---- ASR ----
# "funasr" (MẶC ĐỊNH): dùng FunASR (Paraformer/SenseVoice) làm ASR chính.
# "whisper": dùng thẳng faster-whisper, bỏ qua FunASR hoàn toàn.
# Dù chọn giá trị nào, nếu asr_backend="funasr" mà bị lỗi ở bất kỳ bước nào
# (thiếu package `funasr`, lỗi tải model, lỗi lúc transcribe...) thì asr.py
# sẽ TỰ ĐỘNG fallback sang faster-whisper (log rõ lý do fallback) — không
# cần sửa code, chỉ cần đổi asr_backend ở đây nếu muốn tắt hẳn FunASR.
asr_backend = "funasr"

# ---- ASR — FunASR (backend chính) ----
# Model nhận dạng chính. "paraformer-zh" tối ưu cho tiếng Trung; nếu nội
# dung/audio nguồn không phải tiếng Trung, đổi sang "iic/SenseVoiceSmall"
# (đa ngôn ngữ: zh/en/ja/ko/yue, KHÔNG có tiếng Việt chính thức — với
# asr_language="vi" như mặc định bên dưới, cân nhắc set asr_backend="whisper"
# hoặc để asr_funasr_language="auto" và kiểm tra chất lượng output thực tế).
asr_funasr_model = "iic/SenseVoiceSmall"
asr_funasr_vad_model = "fsmn-vad"     # tách câu/đoạn im lặng trước khi nhận dạng
asr_funasr_punc_model = "ct-punc"     # tự chèn dấu câu vào transcript
asr_funasr_device = "auto"            # auto | cuda | cpu
asr_funasr_language = "auto"          # auto | zh | en | ja | ko | yue (tuỳ model)

# ---- ASR — faster-whisper (phương án dự phòng / asr_backend="whisper") ----
asr_model_size = "small"          # tiny/base/small/medium/large-v3
asr_device = "auto"               # auto | cuda | cpu
asr_compute_type = "auto"         # auto | float16 | int8
asr_language = ""                 # language code, leave empty "" for auto-detect

# ---- Vision ----
# "local" (needs GPU) | "cerebras" | "mistral" | "moondream" (CPU-only, nhanh
# nhất trong các lựa chọn không-GPU — dùng cho máy/CI không có GPU như
# GitHub Actions runner; xem so sánh chi tiết trong docstring đầu vision.py)
# | "gemma4_video" (MẶC ĐỊNH — Gemma 4 12B QAT chính thức của Google, chạy
# QUA OLLAMA: xem clip video qua ảnh trích frame + nghe/đọc phụ đề đồng bộ
# thay vì chỉ đọc ảnh tĩnh rời rạc như moondream, có thinking theo mức độ
# (reasoning_effort, mặc định "high") -> chất lượng đọc cảnh cao hơn hẳn
# moondream (đặc biệt các trường suy luận như emotion/actions/visual_intensity,
# và có thêm draft_narration script_writer.py dùng làm nguyên liệu). Chạy
# được NGAY trên GitHub Actions runner (không cần GPU): workflow tự cài
# Ollama + pull `gemma4:12b-it-qat` ~7GB — cơ chế đã kiểm chứng thành công
# ở dự án fork OpenManus (handandfeet-agent). Chậm hơn backend API, nhưng
# không tốn API key.)
vision_backend = "gemma4_video"
cerebras_vision_model = "gemma-4-31b"
cerebras_vision_max_images = 2
cerebras_vision_rpm = 5

# ---- Vision backend "mistral" ----
mistral_vision_model = "mistral-large-latest"
mistral_vision_max_images = 8
mistral_vision_rpm = 15

# ---- Vision backend "moondream" (Moondream2, ~1.9B, tối ưu CPU/edge) ----
# Model nhỏ hơn Qwen3-VL-4B ~2x và được huấn luyện riêng để chạy nhanh trên
# CPU, nên phù hợp cho GitHub Actions runner (không GPU). Đổi lại chỉ đọc
# 1 keyframe đại diện/scene (không gộp cả vision_frames_per_scene ảnh như
# backend "local"), nên chất lượng đọc cảnh (đặc biệt emotion/visual_intensity)
# kém tinh tế hơn Qwen3-VL-4B hoặc backend API (cerebras/mistral).
# revision: để trống "" nếu muốn luôn dùng bản mới nhất trên Hugging Face
# (rủi ro: HF có thể đổi API khiến code lỗi); pin ngày cụ thể nếu cần ổn định.
moondream_model_name = "vikhyatk/moondream2"
moondream_revision = "2025-06-21"

# ---- Vision backend "gemma4_video" (Gemma 4 12B QAT CHÍNH THỨC của Google,
# chạy QUA OLLAMA — đã kiểm chứng chạy thành công trên GitHub Actions, xem
# handandfeet-agent) ----
# THAY ĐỔI LỚN: trước đây backend này tải google/gemma-4-12B-it-qat-q4_0-
# unquantized (~24GB safetensors) qua transformers, khiến runner Actions
# (~16GB RAM) chết ngay ở stage vision với "unable to mmap ... Cannot
# allocate memory (12)". Giờ chạy qua Ollama `gemma4:12b-it-qat` (GGUF Q4_0
# ~7GB, llama.cpp tối ưu CPU, không cần GPU) — workflow tự cài Ollama + pull
# model. Mỗi clip được trích `gemma4_frames_per_clip` frame gửi kèm phụ đề,
# giữ nguyên tinh thần "xem clip + đối chiếu thoại" của backend này.
# 
# CƠ CHẾ THINKING THEO MỨC ĐỘ (kế thừa từ handandfeet-agent, MẶC ĐỊNH LÀ CAO
# NHẤT — giống như reasoning_effort="high" bên đó):
#   gemma4_reasoning_effort = "high" | "medium" | "low" | "none"
#   "high" = suy nghĩ sâu nhất, chất lượng cao nhất, chậm nhất.
#   "none" = tắt hẳn thinking (nhanh nhưng kém chất lượng).
gemma4_model_name = "gemma4:12b-it-qat"
gemma4_ollama_base_url = "http://127.0.0.1:11434/v1"
gemma4_reasoning_effort = "high"
# Số frame cách đều trích từ mỗi clip .mp4 để gửi cho Ollama (Ollama chỉ nhận
# ảnh, không nhận video như transformers). Frame được resize về
# keyframe_max_side để giảm vision token + tăng tốc.
gemma4_frames_per_clip = 6
# Tổng số token sinh ra tối đa MỖI clip, GỘP CẢ phần thinking LẪN phần JSON
# trả lời cuối — không dùng số nhỏ (vd 768) vì sẽ cắt cụt phần thinking trước
# khi model kịp chốt JSON, luôn gây lỗi parse. reasoning_effort="high" sinh
# nhiều token thinking nên để rộng.
gemma4_max_new_tokens = 8192
# Watchdog timeout (giây) cho MỖI lần generate() 1 clip. Ollama không có cách
# huỷ request giữa chừng một cách "sạch" -> chạy trong thread nền và bỏ mặc
# (daemon) nếu quá hạn, coi clip đó là lỗi (fallback _empty_result) thay vì
# chờ vô thời hạn. Để rộng vì CPU sinh nhiều token thinking có thể mất rất
# lâu, nhưng KHÔNG được bỏ hẳn watchdog — 1 clip lỗi generate vô tận có thể
# nuốt hết ngân sách thời gian job CI.
gemma4_generation_timeout_sec = 1800
# Giới hạn cứng của bản thân model Gemma 4 (mọi size): video tối đa 60s ở
# 1 fps. KHÔNG đặt > 60 — model không tự chunk, phải tự cắt nhỏ trước (xem
# preprocess.extract_scene_clips).
gemma4_max_clip_seconds = 60

vision_model_name = "Qwen/Qwen3-VL-4B-Instruct"
vision_device = "auto"
vision_dtype = "float16"
vision_max_new_tokens = 512
vision_attn_implementation = "sdpa"
# Đã tăng từ 4 -> 8: sau khi keyframe được resize (xem keyframe_max_side bên dưới),
# mỗi ảnh dùng ít VRAM hơn nhiều lần nên có thể gộp nhiều scene/batch hơn mà
# vẫn không OOM. Nếu máy vẫn OOM, hạ số này xuống trước (không cần đụng vào
# keyframe_max_side).
vision_batch_size = 8
vision_frames_per_scene = 3

# ---- Keyframe resize (fix OOM gốc + tăng tốc) ----
# Trước đây keyframe được lưu ở đúng độ phân giải gốc của video (1080p/4K),
# khiến Qwen3-VL (dynamic-resolution) sinh ra rất nhiều vision token và cần
# hàng GiB VRAM chỉ cho 1 lần forward (kể cả batch_size=1). Resize cạnh dài
# nhất về keyframe_max_side px trước khi lưu giúp giảm VRAM + tăng tốc
# generate() đáng kể, trong khi 768px vẫn đủ để model đọc bố cục/cảnh/nhân
# vật/chữ lớn. Có thể tăng lên 960-1024 nếu cần đọc chữ nhỏ chính xác hơn
# và VRAM còn dư, hoặc hạ xuống 512-576 nếu vẫn OOM.
keyframe_max_side = 768
keyframe_jpeg_quality = 90

# ---- Scene detection ----
scene_threshold = 27.0
min_scene_len_sec = 1.0

# ---- Narration / storyboard ----
narration_pov = "third_person"    # third_person | first_person
content_type = "movie"            # movie | tv_drama | anime | short_drama | foreign_language_commentary
genre = "drama"
# Ngôn ngữ VIẾT KỊCH BẢN/NARRATION (hook + toàn bộ câu thoại dẫn chuyện),
# dùng tên ngôn ngữ đầy đủ (LLM hiểu rõ hơn mã ISO) — PHẢI khớp với giọng
# đọc TTS ở mục [tts] voice bên trên, nếu không giọng Việt sẽ đọc văn bản
# tiếng Anh (hoặc ngược lại), nghe rất lạc quẻ. Trước đây key này không tồn
# tại -> script_writer.py chỉ "đoán" ngôn ngữ theo plot_summary do người
# dùng nhập, nếu bỏ trống (Enter) sẽ mặc định về tiếng Anh dù voice đã để
# tiếng Việt.
narration_language = "Vietnamese"
target_duration_sec = 180
# Sau khi sinh 10 hook mở đầu (đã sắp xếp theo tiềm năng viral, xem
# script_writer.generate_hooks), nếu chạy tương tác nhưng người dùng KHÔNG
# nhập số thứ tự trong vòng bấy nhiêu giây, tự động chọn hook #1 (tiềm năng
# cao nhất) — giống hệt như nhấn Enter. Không ảnh hưởng chế độ
# non-interactive (đã tự chọn #1 ngay, không chờ).
hook_selection_timeout_sec = 300   # 5 phút
chars_per_sec = 4.0                # CJK characters per second
# ĐÃ ĐO LẠI (thay số 7.5 cũ, vốn đo từ engine "viterbox" đã gỡ bỏ): với engine
# hiện tại "piper" giọng "vi_VN-vais1000-medium", đo từ tts_report.json thực tế
# (242 câu, tổng 7496 từ / 1993.4s audio thật) -> 7496/1993.4 = 3.76 từ/giây.
# Giọng piper này đọc CHẬM HƠN gấp đôi so với viterbox cũ, nên để nguyên 7.5 sẽ
# khiến mọi clip bị ước tính thiếu ~3s trung bình (có clip lệch tới 8s) ->
# render.py cắt cứng theo slot ước tính -> TTS bị cắt cụt giữa chừng.
# Nếu sau này đổi giọng piper khác hoặc đổi engine (edge-tts/gemini), CẦN ĐO
# LẠI theo đúng cách trên trước khi chạy full pipeline, không dùng lại số này.
words_per_sec = 3.76                 # Vietnamese/English words per second (đo thật từ giọng piper vi_VN-vais1000-medium)
# Hệ số dự phòng nhân vào chars_per_sec/words_per_sec khi ƯỚC TÍNH (không đổi
# tốc độ TTS thật) — TTS thực tế dao động ±10-20% quanh giá trị đo trung vị
# tuỳ câu, nên nếu cứ dùng đúng số đo trung vị, khoảng nửa số câu sẽ đọc CHẬM
# hơn ước tính và lại tràn slot. 0.85 nghĩa là luôn chừa dư ~15% thời gian.
# (Ý tưởng lấy từ speech_safety_margin trong bộ skill video-recap-skills.)
speech_safety_margin = 0.85
buffer_after_speech = 0.1
min_clip_duration = 1.0
# ---- Độ dài video: KHÔNG khoá cứng theo mặc định ----
# "auto" (MẶC ĐỊNH, khuyên dùng): mỗi phim có lượng nội dung đáng kể để kể
#   khác nhau — cảnh cao trào cần nhiều lời bình hơn cảnh chuyển tiếp. Ép mọi
#   video về đúng 1 con số chung dễ cắt mất chỗ cần giữ hoặc giữ lại chỗ thừa
#   một cách máy móc. Ở chế độ này, target_duration_sec chỉ còn là GỢI Ý MỀM
#   dùng để chia ngân sách viết cho từng batch (không ép LLM viết đủ/thiếu
#   cho khớp số), và KHÔNG có bước cắt cứng nào sau khi gộp toàn bộ narration
#   — script_writer chỉ in ra tổng ước tính để bạn biết trước khi tốn TTS +
#   render, xem log "[script_writer] processing.target_duration_mode='auto'".
# "fixed": quay lại hành vi ép cứng — sau khi gộp mọi batch, nếu tổng vượt
#   target_duration_sec * target_duration_tolerance, tự cắt bớt câu khớp cảnh
#   yếu nhất (match_score thấp) cho tới khi vừa ngân sách, luôn giữ câu
#   đầu/cuối. Chỉ nên bật nếu bạn thực sự cần khớp giới hạn thời lượng cứng
#   (vd ràng buộc nền tảng đăng video, không phải để "video ngắn gọn hơn").
target_duration_mode = "auto"       # target_duration_sec ở trên chỉ là gợi ý mềm khi mode="auto"
target_duration_tolerance = 1.15    # chỉ dùng khi mode="fixed"
max_speed_ratio = 4.0
# MỚI: chặn dưới cho tốc độ clip gốc bị KÉO CHẬM để khớp lời bình dài — trước
# đây không có chặn dưới, lời bình dài hơn nhiều so với cảnh gốc sẽ làm clip
# bị kéo chậm không giới hạn (trông "lê thê", đơ hình). Dưới ngưỡng này,
# render.py kẹp tốc độ lại và bù phần thời lượng còn thiếu bằng đông cứng
# khung hình cuối, thay vì kéo chậm quá mức. Xem pacing_report.json (sinh ra
# ở stage 'script') để biết trước clip nào sẽ bị kẹp tốc độ (gấp hoặc lê thê)
# trước khi chạy TTS + render.
min_speed_ratio = 0.5

# ---- Checkpoint frequency ----
# micro_checkpoint_interval: save checkpoint every N items (scenes/batches)
# Lower = more frequent (near real-time). Default: 1 = every item.
micro_checkpoint_interval = 1
# auto_sync_cloud: auto sync to cloud storage (Tigris) after each checkpoint
auto_sync_cloud = true

[ci]
# Đã xác nhận runner GitHub Actions (ubuntu-latest, 4 vCPU / 16GB RAM / đủ
# disk sau khi dọn rác — xem cleanup.py và bước "Free disk space" trong
# .github/workflows/run-pipeline.yml) đủ sức chạy trực tiếp các backend
# "local" (script_backend, vision_backend, asr_backend ở trên) NGAY trên CI
# — không cần tự động đổi sang API nữa. Đặt lại true bất kỳ lúc nào để quay
# về chế độ an toàn cũ (tự đổi sang cerebras/mistral/whisper trên CI).
force_lightweight_backends = false

[reference]
# Link video tham khảo (đối thủ) để AI đối chiếu đúng tên nhân vật/cốt
# truyện khi viết narration — KHÔNG dùng để sao chép văn phong.
urls = []
languages = ["vi", "en"]
max_chars_per_video = 6000
use_ytdlp_fallback = true
ytdlp_cookies_from_browser = ""

[paths]
input_video = "./input/source.mp4"
output_dir = "./output"
checkpoint_dir = "./checkpoints"
model_cache_dir = "./model_cache"
# projects_dir: where all projects are stored
projects_dir = "./projects"

[cloud]
# Đang dùng Tigris (https://www.tigrisdata.com). Mục này (và code trong
# cloud_storage.py) hoàn toàn generic cho mọi provider tương thích S3 —
# chỉ cần đổi giá trị bên dưới là dùng được provider khác (Filebase, AWS S3,
# Cloudflare R2, ...), không cần sửa code.
# Access key (Tigris)
access_key = "tid_dNkBsQSwjrwPNURmxVXaAVHbTti_atxKRhbAFLgzidMEUBhiNs"
# Secret key (Tigris)
secret_key = "tsec_tSF2U_bmM6qAkMneeR848yOrZUzVvYAcfVFTBbL7iJIdhcoI1SJGO_kW1AthM4gqqhW9CY"
# Bucket name
bucket_name = "ai-director-video-ngocquynh"
# Tigris S3 endpoint (dùng ngoài mạng Fly.io; nếu chạy trên Fly.io có thể
# đổi sang "https://fly.storage.tigris.dev" để giảm độ trễ)
endpoint_url = "https://t3.storage.dev"
# Tigris dùng region "auto" (không phải vùng AWS cụ thể như Filebase)
region_name = "auto"
# Tigris BẮT BUỘC dùng virtual-hosted style (bucket nằm trong hostname),
# khác với Filebase dùng "path". Đặt sai sẽ gây lỗi 403/404 khó hiểu.
addressing_style = "virtual"
# Enable/disable cloud sync
enabled = true

[project]
# Default project settings
auto_project_scan = true
show_project_menu_on_start = true
# Auto-save interval in seconds (0 = after each stage)
auto_save_interval = 0
# Max cloud sync retry attempts
cloud_sync_retries = 3
# Tự động xoá project cũ, chỉ giữ lại "keep_projects_count" project mới
# nhất (local + cloud). Mặc định BẬT. Đặt false để tắt hẳn (giữ mọi
# project như trước).
auto_prune_old_projects = true
# Số project mới nhất được giữ lại khi auto_prune_old_projects = true.
# Mặc định 1 = chỉ giữ đúng 1 project mới nhất, tự xoá hết project còn lại.
keep_projects_count = 1
